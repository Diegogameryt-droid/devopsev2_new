# =====================================================================
#  Pushgateway: el pipeline (GitHub Actions) le envía el tiempo de
#  despliegue, la cobertura de pruebas, etc. Prometheus lo lee de aquí.
#  Solo accesible dentro del clúster / la EC2 (no se expone a internet).
# =====================================================================
fullnameOverride: pushgateway

serviceMonitor:
  enabled: true
  honorLabels: true

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
