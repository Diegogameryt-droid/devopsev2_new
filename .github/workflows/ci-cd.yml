# =====================================================================
#  Pipeline CI/CD - ms-vehiculos (DOY0101)
#
#  1) build-test  -> compila y corre las pruebas JUnit (+ cobertura JaCoCo)
#  2) sonar       -> análisis SonarCloud. Si el Quality Gate falla, se DETIENE
#  3) docker      -> Hadolint + manifiestos K8s (kubeconform + Trivy config)
#                    + construye imagen + Trivy. Si hay CRITICAL, se DETIENE
#                    (solo en main) sube la imagen a GitHub Container Registry
#  4) deploy      -> (solo en main) despliega en Kubernetes (k3s) en la EC2,
#                    verifica que responda y envía métricas del pipeline
#                    (cobertura, tiempo de despliegue) a Prometheus/Grafana
#
#  Cada etapa depende de la anterior ("needs"): si una falla,
#  las siguientes NO se ejecutan y nada llega a la EC2.
# =====================================================================
name: CI-CD ms-vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  build-test:
    name: 1. Build y pruebas
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cobertura.outputs.coverage }}
      tests: ${{ steps.cobertura.outputs.tests }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Calcular cobertura y cantidad de pruebas
        id: cobertura
        run: |
          COV=$(awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "%.1f", (m+c)>0 ? 100*c/(m+c) : 0}' target/site/jacoco/jacoco.csv)
          TESTS=$(grep -ho 'tests="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "coverage=$COV" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "### Cobertura de líneas: ${COV}% · Pruebas: ${TESTS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # ------------------------------------------------------------------
  sonar:
    name: 2. Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Analizar código y esperar Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.qualitygate.wait=true

  # ------------------------------------------------------------------
  docker:
    name: 3. Imagen Docker y seguridad
    runs-on: ubuntu-latest
    needs: sonar
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nombre.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar Dockerfile (Hadolint)
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Validar manifiestos de Kubernetes (kubeconform)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-missing-schemas /k8s

      - name: Seguridad de manifiestos Kubernetes (Trivy config, falla si hay CRITICAL)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" aquasec/trivy:latest config \
            --exit-code 1 --severity CRITICAL /k8s

      - name: Definir nombre de la imagen
        id: nombre
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: docker build -t "${{ steps.nombre.outputs.image }}" .

      - name: Escanear imagen con Trivy (falla si hay CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --no-progress \
            "${{ steps.nombre.outputs.image }}"

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Subir imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.nombre.outputs.image }}"

  # ------------------------------------------------------------------
  deploy:
    name: 4. Despliegue en Kubernetes (EC2)
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      COVERAGE: ${{ needs.build-test.outputs.coverage }}
      TESTS: ${{ needs.build-test.outputs.tests }}
      COMMIT_TS: ${{ github.event.head_commit.timestamp }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar llave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copiar manifiestos de Kubernetes a la EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "mkdir -p ~/ms-vehiculos"
          scp -i ~/.ssh/ec2.pem -r k8s "$EC2_USER@$EC2_HOST:~/ms-vehiculos/"

      - name: Desplegar en Kubernetes
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "IMAGE_TAG='${GITHUB_SHA::7}' DB_PASSWORD='$DB_PASSWORD' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' COVERAGE='$COVERAGE' TESTS='$TESTS' COMMIT_TS='$COMMIT_TS' RUN_NUMBER='$RUN_NUMBER' bash ~/ms-vehiculos/k8s/deploy.sh"

      - name: Verificar que el microservicio responde
        run: |
          for i in $(seq 1 20); do
            if curl -fs "http://$EC2_HOST/actuator/health"; then
              echo ""
              echo "✅ ms-vehiculos desplegado en Kubernetes y sano en http://$EC2_HOST"
              exit 0
            fi
            echo "Esperando que responda... ($i/20)"
            sleep 6
          done
          echo "❌ El microservicio no respondió"
          exit 1
