# =====================================================================
#  Pipeline CI/CD - ms-vehiculos (DOY0101)
#
#  1) build-test  -> compila y corre las pruebas JUnit (+ cobertura JaCoCo)
#  2) sonar       -> análisis SonarCloud. Si el Quality Gate falla, se DETIENE
#  3) docker      -> Hadolint + construye imagen + Trivy. Si hay CRITICAL, se DETIENE
#                    (solo en main) sube la imagen a GitHub Container Registry
#  4) deploy      -> (solo en main) despliega en la EC2 con Docker Compose
#                    y verifica que el microservicio responda
#
#  Cada etapa depende de la anterior ("needs"): si una falla,
#  las siguientes NO se ejecutan y nada llega a la EC2.
# =====================================================================
name: CI-CD ms-vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  build-test:
    name: 1. Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Guardar reporte de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # ------------------------------------------------------------------
  sonar:
    name: 2. Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Analizar código y esperar Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.qualitygate.wait=true

  # ------------------------------------------------------------------
  docker:
    name: 3. Imagen Docker y seguridad
    runs-on: ubuntu-latest
    needs: sonar
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nombre.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar Dockerfile (Hadolint)
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Definir nombre de la imagen
        id: nombre
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: docker build -t "${{ steps.nombre.outputs.image }}" .

      - name: Escanear imagen con Trivy (falla si hay CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --no-progress \
            "${{ steps.nombre.outputs.image }}"

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Subir imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.nombre.outputs.image }}"

  # ------------------------------------------------------------------
  deploy:
    name: 4. Despliegue en EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      IMAGE: ${{ needs.docker.outputs.image }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copiar docker-compose.yml a la EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "mkdir -p ~/ms-vehiculos"
          scp -i ~/.ssh/ec2.pem docker-compose.yml "$EC2_USER@$EC2_HOST:~/ms-vehiculos/docker-compose.yml"

      - name: Desplegar con Docker Compose
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" bash -s <<EOF
            set -e
            cd ~/ms-vehiculos
            printf 'IMAGE=%s\nDB_PASSWORD=%s\n' '$IMAGE' '$DB_PASSWORD' > .env
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
            docker compose pull ms-vehiculos
            docker compose up -d --no-build
            docker image prune -f
          EOF

      - name: Verificar que el microservicio responde
        run: |
          for i in $(seq 1 20); do
            if curl -fs "http://$EC2_HOST/actuator/health"; then
              echo ""
              echo "✅ ms-vehiculos desplegado y sano en http://$EC2_HOST"
              exit 0
            fi
            echo "Esperando que arranque... ($i/20)"
            sleep 6
          done
          echo "❌ El microservicio no respondió"
          exit 1
