# =====================================================================
#  MySQL 8 dentro del clúster
#  - Volumen persistente (los datos sobreviven a reinicios del pod)
#  - La clave viene del Secret "db-secret" (lo crea el pipeline, no está en el repo)
#  - Solo accesible dentro del clúster (Service ClusterIP)
# =====================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: vehiculos
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: vehiculos
  labels:
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate          # nunca dos MySQL sobre el mismo disco
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # usuario "mysql" de la imagen oficial
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              value: vehiculos
          args:
            - --innodb-buffer-pool-size=128M
            - --performance-schema=OFF
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: vehiculos
  labels:
    app: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
