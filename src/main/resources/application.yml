spring:
  application:
    name: ms-vehiculos
  datasource:
    # Por defecto usa MySQL en tu propio PC (localhost).
    # En Kubernetes / Docker Compose se reemplaza con la variable DB_URL.
    url: ${DB_URL:jdbc:mysql://localhost:3306/vehiculos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # Sin clave escrita en el código: se entrega con la variable DB_PASSWORD
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${SERVER_PORT:9004}
  # EV3: cada petición HTTP queda en los logs (stdout) con su código de estado.
  # CloudWatch Logs cuenta los 4xx/5xx a partir de estas líneas.
  tomcat:
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      rotate: false
      buffered: false
      pattern: '%h %l %u %t "%r" %s %b'

# Actuator: salud (probes de Kubernetes)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
